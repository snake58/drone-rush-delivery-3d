<script>
"use strict";
/* ============================================================
   BUS JAM: TERMINAL RUSH — original bus-sorting puzzle.
   Sort waiting passengers into matching buses before the
   terminal overflows. Portrait, touch-first, single file.
   ============================================================ */

/* ---------------- utils ---------------- */
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
function easeOut(t){return 1-Math.pow(1-t,3);}
function easeIn(t){return t*t*t;}
function easeOutBack(t){const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);}

/* ---------------- storage (portal-aware, promise-based) ---------------- */
const Store = window.Store = window.Store || {
  get(k){ try{ return Promise.resolve(localStorage.getItem("busterminal_"+k)); }catch(e){ return Promise.resolve(null); } },
  set(k,v){ try{ localStorage.setItem("busterminal_"+k, String(v)); }catch(e){} return Promise.resolve(); }
};

/* ---------------- audio (WebAudio, muted-safe) ---------------- */
const Sfx = window.Sfx = {
  ctx:null, muted:false,
  ensure(){
    if(this.ctx) return true;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return false;
      this.ctx = new AC(); return true;
    }catch(e){ return false; }
  },
  setMuted(m){
    this.muted = !!m;
    try{ if(this.ctx){ if(m) this.ctx.suspend(); else if(this.ctx.state==="suspended") this.ctx.resume(); } }catch(e){}
    Store.set("muted", this.muted?"1":"0");
  },
  tone(f0,f1,dur,type,vol,when){
    if(this.muted || !this.ensure()) return;
    try{
      const t=this.ctx.currentTime+(when||0), o=this.ctx.createOscillator(), g=this.ctx.createGain();
      o.type=type||"sine"; o.frequency.setValueAtTime(Math.max(30,f0),t);
      o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
      g.gain.setValueAtTime(vol||0.12,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
      o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t+dur+0.03);
    }catch(e){}
  },
  click(){ this.tone(700,900,0.06,"square",0.06); },
  board(){ this.tone(520,980,0.12,"sine",0.10); this.tone(780,1400,0.10,"sine",0.07,0.05); },
  deny(){ this.tone(220,140,0.18,"sawtooth",0.08); },
  coin(){ this.tone(1320,1760,0.09,"triangle",0.09); },
  horn(){ this.tone(196,185,0.35,"sawtooth",0.10); this.tone(147,139,0.35,"sawtooth",0.08,0.02); },
  depart(){ this.tone(120,420,0.5,"sawtooth",0.07); this.horn(); },
  arrive(){ this.tone(300,120,0.4,"sawtooth",0.06); },
  combo(n){ const b=440+Math.min(n,20)*22; this.tone(b,b*1.5,0.12,"triangle",0.10); this.tone(b*1.5,b*2,0.12,"triangle",0.08,0.08); },
  freeze(){ this.tone(1800,600,0.4,"sine",0.07); },
  win(){ const n=[523,659,784,1047]; n.forEach((f,i)=>this.tone(f,f,0.16,"triangle",0.10,i*0.11)); },
  lose(){ const n=[392,330,262,196]; n.forEach((f,i)=>this.tone(f,f*0.94,0.22,"sawtooth",0.08,i*0.14)); },
};

/* ---------------- palette ---------------- */
const COLORS=[
  {name:"red",    main:"#ef4444", dark:"#991b1b", light:"#fca5a5", shape:"circle"},
  {name:"blue",   main:"#3b82f6", dark:"#1e40af", light:"#93c5fd", shape:"square"},
  {name:"green",  main:"#22c55e", dark:"#166534", light:"#86efac", shape:"tri"},
  {name:"yellow", main:"#eab308", dark:"#854d0e", light:"#fde047", shape:"star"},
  {name:"purple", main:"#a855f7", dark:"#6b21a8", light:"#c084fc", shape:"diamond"},
];
const SKIN=["#ffd9b3","#f1c27d","#e0ac69","#c68642","#8d5524"];

/* ---------------- sprite layers need the font early (used at load by buildSprites) ---------------- */
const SYSFONT="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Roboto,sans-serif";
/* ---------------- prerendered sprite layers (visual only) ----------------
   Static artwork is painted once per DPR change into offscreen canvases and
   blitted each frame: zero per-frame gradient allocations on the hot paths.
   Everything is painted at the effective DPR so text and shapes stay crisp. */
let SPR_DPR=2;
const Sprites={ sky:null, ground:null, vig:null, coin:null, bus:{}, pax:{}, glow:{}, ui:{} };
function effDPR(){ return clamp(window.devicePixelRatio||1, 2, 3); } // min 2: supersampled sharpness on 1080p+
function makeLayer(w,h){
  const c=document.createElement("canvas");
  c.width=Math.max(2,Math.round(w*SPR_DPR)); c.height=Math.max(2,Math.round(h*SPR_DPR));
  const g=c.getContext("2d"); g.setTransform(SPR_DPR,0,0,SPR_DPR,0,0);
  return {img:c, g:g, w:w, h:h};
}
function makeLayerDev(w,h){
  const c=document.createElement("canvas");
  c.width=Math.max(2,Math.round(w)); c.height=Math.max(2,Math.round(h));
  return {img:c, g:c.getContext("2d"), w:w, h:h};
}
function uiSprite(key,w,h,painter){
  let s=Sprites.ui[key];
  if(!s){ const L=makeLayer(w,h); painter(L.g); s={img:L.img,w:w,h:h}; Sprites.ui[key]=s; }
  return s;
}
function paintSky(c){
  const g=c.createLinearGradient(0,0,0,300);
  g.addColorStop(0,"#0d1b3d"); g.addColorStop(0.55,"#274b7a"); g.addColorStop(1,"#e08a4e");
  c.fillStyle=g; c.fillRect(0,0,LW,300);
  c.save(); c.globalCompositeOperation="lighter";           // additive sun glow
  const sg=c.createRadialGradient(392,208,4,392,208,95);
  sg.addColorStop(0,"rgba(255,196,110,0.85)"); sg.addColorStop(1,"rgba(255,196,110,0)");
  c.fillStyle=sg; c.beginPath(); c.arc(392,208,95,0,7); c.fill();
  c.restore();
  c.fillStyle="#ffd9a0"; c.beginPath(); c.arc(392,208,26,0,7); c.fill();
  for(let i=0;i<26;i++){
    const sx=(i*167)%LW, sy=(i*89)%120;
    c.globalAlpha=0.2+((i*37)%50)/120; c.fillStyle="#fff"; c.fillRect(sx,sy,2,2);
  }
  c.globalAlpha=1;
}
function paintGround(c){
  let g=c.createLinearGradient(0,64,0,254);
  g.addColorStop(0,"#2c3e63"); g.addColorStop(1,"#1a2745");
  c.fillStyle=g; c.fillRect(0,64,LW,190);
  c.fillStyle="rgba(255,255,255,0.10)"; c.fillRect(0,64,LW,10);
  for(let r=0;r<2;r++) for(let i=0;i<6;i++){
    const wx=24+i*74, wy=96+r*52, lit=((i*7+r*3)%4)!==0;
    c.fillStyle=lit?"#ffd98a":"#3a4f78";
    rr(c,wx,wy,58,38,6); c.fill();
    c.fillStyle=lit?"rgba(255,255,255,0.45)":"rgba(255,255,255,0.08)";
    rr(c,wx+4,wy+4,50,10,4); c.fill();
  }
  c.fillStyle="rgba(0,0,0,0.35)"; rr(c,120,199,240,34,10); c.fill();
  const sgb=c.createLinearGradient(0,196,0,230);
  sgb.addColorStop(0,"#3b5a8f"); sgb.addColorStop(1,"#22355c");
  c.fillStyle=sgb; rr(c,120,196,240,34,10); c.fill();
  gloss(c,122,198,236,30,8,0.25);
  c.fillStyle="#ffe9b0"; c.font=font(800,19); c.textAlign="center"; c.textBaseline="middle";
  try{c.letterSpacing="2px";}catch(e){}
  c.fillText("BUS TERMINAL",240,214);
  try{c.letterSpacing="0px";}catch(e){}
  c.fillStyle="rgba(0,0,0,0.4)"; rr(c,28,153,64,104,10); c.fill();
  g=c.createLinearGradient(0,150,0,254);
  g.addColorStop(0,"#31456e"); g.addColorStop(1,"#1c2a4d");
  c.fillStyle=g; rr(c,28,150,64,104,10); c.fill();
  c.fillStyle="#ffd166"; c.font=font(800,13);
  c.fillText("IN",60,262);
  g=c.createLinearGradient(0,254,0,590);
  g.addColorStop(0,"#3d4a68"); g.addColorStop(1,"#2b3654");
  c.fillStyle=g; c.fillRect(0,254,LW,336);
  c.strokeStyle="rgba(255,255,255,0.06)"; c.lineWidth=1;
  for(let x=0;x<LW;x+=55){ c.beginPath(); c.moveTo(x,254); c.lineTo(x,590); c.stroke(); }
  for(let y=254;y<590;y+=48){ c.beginPath(); c.moveTo(0,y); c.lineTo(LW,y); c.stroke(); }
  const pg=c.createRadialGradient(240,300,10,240,300,260);
  pg.addColorStop(0,"rgba(255,190,120,0.14)"); pg.addColorStop(1,"rgba(255,190,120,0)");
  c.fillStyle=pg; c.fillRect(0,254,LW,336);
  g=c.createLinearGradient(0,590,0,800);
  g.addColorStop(0,"#232b40"); g.addColorStop(1,"#161c2e");
  c.fillStyle=g; c.fillRect(0,590,LW,210);
  c.fillStyle="rgba(255,255,255,0.08)"; c.fillRect(0,590,LW,3);
}
function busSprite(ci){
  let s=Sprites.bus[ci];
  if(s) return s;
  const col=COLORS[ci], W2=456, H2=84, ox=8, oy=10, bx=0;
  const L=makeLayer(W2,H2), c=L.g;
  c.translate(ox,oy);
  let g=c.createLinearGradient(0,0,0,48);
  g.addColorStop(0,col.light); g.addColorStop(0.35,col.main); g.addColorStop(1,col.dark);
  c.fillStyle=g; rr(c,bx,0,BUS_W,48,14); c.fill();
  c.lineWidth=2; c.strokeStyle="rgba(0,0,0,0.25)"; rr(c,bx,0,BUS_W,48,14); c.stroke();
  gloss(c,bx+3,3,BUS_W-6,42,11,0.30);
  c.fillStyle="rgba(255,255,255,0.18)"; rr(c,bx+14,3,BUS_W-28,8,4); c.fill();
  c.fillStyle="rgba(0,0,0,0.22)"; rr(c,bx+4,38,BUS_W-8,7,3); c.fill();
  c.save();
  rr(c,bx+66,14,268,22,8); c.clip();
  g=c.createLinearGradient(0,14,0,36);
  g.addColorStop(0,"#f0f7ff"); g.addColorStop(1,"#9db9dd");
  c.fillStyle=g; c.fillRect(bx+66,14,268,22);
  c.fillStyle="rgba(255,255,255,0.65)";
  c.beginPath();
  c.moveTo(bx+120,14); c.lineTo(bx+160,14); c.lineTo(bx+120,36); c.lineTo(bx+80,36);
  c.closePath(); c.fill();
  c.beginPath();
  c.moveTo(bx+220,14); c.lineTo(bx+244,14); c.lineTo(bx+204,36); c.lineTo(bx+180,36);
  c.closePath(); c.fill();
  c.restore();
  c.strokeStyle="rgba(0,0,0,0.30)"; c.lineWidth=2;
  rr(c,bx+66,14,268,22,8); c.stroke();
  for(let i=0;i<4;i++){ c.beginPath(); c.moveTo(bx+66+67*(i+1),15); c.lineTo(bx+66+67*(i+1),35); c.stroke(); }
  c.save();
  c.beginPath(); c.moveTo(bx+BUS_W-58,12); c.lineTo(bx+BUS_W-8,12);
  c.lineTo(bx+BUS_W-8,40); c.lineTo(bx+BUS_W-58,40); c.closePath(); c.clip();
  g=c.createLinearGradient(0,12,0,40);
  g.addColorStop(0,"#e8f2ff"); g.addColorStop(1,"#8fb0dd");
  c.fillStyle=g; c.fillRect(bx+BUS_W-58,12,50,28);
  c.fillStyle="rgba(255,255,255,0.55)";
  c.beginPath(); c.moveTo(bx+BUS_W-48,12); c.lineTo(bx+BUS_W-34,12);
  c.lineTo(bx+BUS_W-48,40); c.lineTo(bx+BUS_W-58,40); c.closePath(); c.fill();
  c.restore();
  c.fillStyle="rgba(0,0,0,0.30)"; rr(c,bx+BUS_W-72,8,20,40,4); c.fill();
  c.fillStyle="rgba(255,255,255,0.25)"; rr(c,bx+BUS_W-70,10,4,36,2); c.fill();
  c.save(); c.globalCompositeOperation="lighter";          // additive headlight halo
  const hl=c.createRadialGradient(bx+BUS_W-6,40,1,bx+BUS_W-6,40,15);
  hl.addColorStop(0,"rgba(255,251,224,0.95)"); hl.addColorStop(1,"rgba(253,230,138,0)");
  c.fillStyle=hl; c.beginPath(); c.arc(bx+BUS_W-6,40,15,0,7); c.fill();
  c.restore();
  c.fillStyle="#fffbe0"; c.beginPath(); c.arc(bx+BUS_W-6,40,5,0,7); c.fill();
  [bx+90,bx+BUS_W-90].forEach(wx=>{
    c.fillStyle="#111827"; c.beginPath(); c.arc(wx,50,15,0,7); c.fill();
    c.fillStyle="#374151"; c.beginPath(); c.arc(wx,50,10,0,7); c.fill();
    const wg=c.createLinearGradient(wx-6,44,wx+6,56);
    wg.addColorStop(0,"#e5e7eb"); wg.addColorStop(1,"#9ca3af");
    c.fillStyle=wg; c.beginPath(); c.arc(wx,50,6,0,7); c.fill();
    c.fillStyle="rgba(255,255,255,0.8)"; c.beginPath(); c.arc(wx-2,48,1.8,0,7); c.fill();
  });
  c.fillStyle="rgba(0,0,0,0.25)"; rr(c,bx+8,14,52,30,8); c.fill();
  c.fillStyle="#fff"; rr(c,bx+8,12,52,30,8); c.fill();
  gloss(c,bx+10,14,48,26,6,0.4);
  drawShapeIcon(c,col.shape,bx+24,24,22,col.dark);
  s={img:L.img,w:W2,h:H2,ox:ox,oy:oy};
  Sprites.bus[ci]=s; return s;
}
function paxSprite(ci,skin,blink){
  const key=ci+"|"+skin+"|"+(blink?1:0);
  let s=Sprites.pax[key];
  if(s) return s;
  const col=COLORS[ci], W2=64, H2=100, ox=32, oy=64;
  const L=makeLayer(W2,H2), c=L.g;
  c.translate(ox,oy); // (0,0) == passenger (x,y)
  const bg=c.createLinearGradient(0,-26,0,24);
  bg.addColorStop(0,col.light); bg.addColorStop(0.45,col.main); bg.addColorStop(1,col.dark);
  c.fillStyle=bg; rr(c,-22,-26,44,50,16); c.fill();
  c.lineWidth=2.5; c.strokeStyle=col.dark; rr(c,-22,-26,44,50,16); c.stroke();
  gloss(c,-20,-24,40,44,14,0.28);
  const hg=c.createRadialGradient(-6,-48,4,0,-40,20);
  hg.addColorStop(0,shade(skin,1.07)); hg.addColorStop(1,skin);
  c.fillStyle=hg; c.beginPath(); c.arc(0,-40,19,0,7); c.fill();
  // shiny eyes, baked (blink variant squashes them exactly like the dynamic version did)
  const bk=blink?0.15:1;
  for(const ex of [-7,7]){
    c.fillStyle="#fff"; c.beginPath(); c.ellipse(ex,-42,5,5.4*bk,0,0,7); c.fill();
    c.fillStyle="#1f2937"; c.beginPath(); c.arc(ex,-41,2.8*bk+0.4,0,7); c.fill();
    if(!blink){ c.fillStyle="#fff"; c.beginPath(); c.arc(ex+1,-42.6,1.1,0,7); c.fill(); }
  }
  c.fillStyle="rgba(244,114,182,0.5)";
  c.beginPath(); c.arc(-11,-34,4,0,7); c.fill();
  c.beginPath(); c.arc(11,-34,4,0,7); c.fill();
  c.strokeStyle="#7c4a32"; c.lineWidth=2;
  c.beginPath(); c.arc(0,-35,5,0.35,Math.PI-0.35); c.stroke();
  c.fillStyle="rgba(255,255,255,0.30)";
  c.beginPath(); c.arc(0,2,12.5,0,7); c.fill();
  c.fillStyle="#fff";
  c.beginPath(); c.arc(0,2,11,0,7); c.fill();
  drawShapeIcon(c,col.shape,0,2,15,col.dark);
  s={img:L.img,w:W2,h:H2,ox:ox,oy:oy};
  Sprites.pax[key]=s; return s;
}
function glowDot(col,r){
  const q=Math.max(2,Math.round(r)), key=col+"|"+q;
  let s=Sprites.glow[key];
  if(s) return s;
  const d=q*4, L=makeLayer(d,d), c=L.g;
  const g=c.createRadialGradient(d/2,d/2,0,d/2,d/2,d/2);
  g.addColorStop(0,col); g.addColorStop(0.45,col); g.addColorStop(1,"rgba(0,0,0,0)");
  c.fillStyle=g; c.fillRect(0,0,d,d);
  s={img:L.img,w:d,h:d};
  Sprites.glow[key]=s; return s;
}
function shadowSprite(){
  // one shared soft ellipse shadow (replaces per-entity beginPath+ellipse+fill)
  let s=Sprites.shadow;
  if(s) return s;
  const W2=80,H2=24,L=makeLayer(W2,H2),c=L.g;
  c.save(); c.translate(W2/2,H2/2); c.scale(1,H2/W2);
  const g=c.createRadialGradient(0,0,2,0,0,W2/2);
  g.addColorStop(0,"rgba(0,0,0,0.30)"); g.addColorStop(1,"rgba(0,0,0,0)");
  c.fillStyle=g; c.beginPath(); c.arc(0,0,W2/2-1,0,7); c.fill(); c.restore();
  s={img:L.img,w:W2,h:H2}; Sprites.shadow=s; return s;
}
function cloudSprite(){
  // one shared cloud puff (baked once; drawn 1-2 calls instead of ~11)
  let s=Sprites.cloud;
  if(s) return s;
  const W2=150,H2=70,L=makeLayer(W2,H2),c=L.g;
  c.fillStyle="rgba(38,58,108,0.9)";
  c.beginPath();
  c.ellipse(60,32,34,14,0,0,7);
  c.ellipse(86,36,24,11,0,0,7);
  c.ellipse(34,37,22,10,0,0,7);
  c.fill();
  c.fillStyle="rgba(255,170,120,0.30)";
  c.beginPath(); c.ellipse(60,40,30,7,0,0,7); c.fill();
  s={img:L.img,w:W2,h:H2}; Sprites.cloud=s; return s;
}
function coinSprite(){
  let s=Sprites.coin;
  if(s) return s;
  const d=48, L=makeLayer(d,d), c=L.g, cx=d/2, cy=d/2;
  c.save(); c.globalCompositeOperation="lighter";          // additive halo
  const halo=c.createRadialGradient(cx,cy,4,cx,cy,23);
  halo.addColorStop(0,"rgba(251,191,36,0.55)"); halo.addColorStop(1,"rgba(251,191,36,0)");
  c.fillStyle=halo; c.beginPath(); c.arc(cx,cy,23,0,7); c.fill();
  c.restore();
  const cg=c.createRadialGradient(cx-3,cy-4,2,cx,cy,14);
  cg.addColorStop(0,"#fef3c7"); cg.addColorStop(0.6,"#fbbf24"); cg.addColorStop(1,"#b45309");
  c.fillStyle=cg; c.beginPath(); c.arc(cx,cy,13,0,7); c.fill();
  c.lineWidth=2; c.strokeStyle="#92400e"; c.beginPath(); c.arc(cx,cy,13,0,7); c.stroke();
  c.fillStyle="#92400e"; c.font=font(800,15); c.textAlign="center"; c.textBaseline="middle";
  c.fillText("$",cx,cy+1);
  s={img:L.img,w:d,h:d};
  Sprites.coin=s; return s;
}
function buildSprites(dpr){
  SPR_DPR=dpr||SPR_DPR;
  // Background layers are built at EXACT device size and blitted 1:1 (identity
  // transform): no per-frame resampling cost in software rendering.
  // The vignette is baked into both layers, so there is no extra fullscreen pass.
  const s=canvas.width/LW; // device px per logical px
  Sprites.devS=s;
  Sprites.sky=null; Sprites.ground=null; Sprites.vig=null; Sprites.coin=null;
  Sprites.shadow=null; Sprites.cloud=null;
  Sprites.bus={}; Sprites.pax={}; Sprites.glow={}; Sprites.ui={};
  let L=makeLayerDev(canvas.width, Math.round(300*s));
  L.g.setTransform(s,0,0,s,0,0);
  paintSky(L.g); paintVig(L.g);
  Sprites.sky=L.img;
  const gy=Math.round(64*s);
  L=makeLayerDev(canvas.width, canvas.height-gy);
  L.g.setTransform(s,0,0,s,0,-64*s);
  paintGround(L.g); paintVig(L.g);
  Sprites.ground=L.img; Sprites.groundY=gy;
}
function paintVig(c){
  const g=c.createRadialGradient(LW/2,LH/2,LH*0.40,LW/2,LH/2,LH*0.74);
  g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(1,"rgba(4,7,16,0.34)");
  c.fillStyle=g; c.fillRect(0,0,LW,LH);
}

/* ---------------- canvas setup ---------------- */
const LW=480, LH=800;
const canvas = document.getElementById("c");
const ctx = canvas ? canvas.getContext("2d", {alpha:false, desynchronized:true}) : null; // opaque: faster composite, no alpha blend
function fitCanvas(){
  if(!canvas) return;
  const ww=window.innerWidth||LW, wh=window.innerHeight||LH;
  const s=Math.min(ww/LW, wh/LH);
  const dpr=effDPR();
  canvas.width=Math.round(LW*s*dpr);
  canvas.height=Math.round(LH*s*dpr);
  canvas.style.width=Math.round(LW*s)+"px";
  canvas.style.height=Math.round(LH*s)+"px";
  if(ctx) ctx.setTransform(canvas.width/LW,0,0,canvas.height/LH,0,0);
  try{ buildSprites(dpr); }catch(e){}
}
if(typeof window!=="undefined" && window.addEventListener){
  window.addEventListener("resize", fitCanvas);
  window.addEventListener("orientationchange", ()=>setTimeout(fitCanvas,120));
}
fitCanvas();

/* ---------------- drawing helpers ---------------- */
function rr(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function drawShapeIcon(c,shape,x,y,s,col){
  c.fillStyle=col||"#fff"; c.beginPath();
  if(shape==="circle"){ c.arc(x,y,s*0.5,0,7); c.fill(); }
  else if(shape==="square"){ c.fillRect(x-s*0.42,y-s*0.42,s*0.84,s*0.84); }
  else if(shape==="tri"){ c.moveTo(x,y-s*0.5); c.lineTo(x+s*0.5,y+s*0.42); c.lineTo(x-s*0.5,y+s*0.42); c.closePath(); c.fill(); }
  else if(shape==="diamond"){ c.moveTo(x,y-s*0.55); c.lineTo(x+s*0.42,y); c.lineTo(x,y+s*0.55); c.lineTo(x-s*0.42,y); c.closePath(); c.fill(); }
  else { // star
    for(let i=0;i<10;i++){ const r=i%2? s*0.24:s*0.52, a=-Math.PI/2+i*Math.PI/5;
      c[i?"lineTo":"moveTo"](x+Math.cos(a)*r, y+Math.sin(a)*r); }
    c.closePath(); c.fill();
  }
}

/* ---------------- modern art helpers (visual layer only) ---------------- */
function font(w,s){ return w+" "+s+"px "+SYSFONT; }
function shade(hex,f){ // f<1 darken, f>1 lighten
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  if(f<=1){ r*=f; g*=f; b*=f; } else { r+=(255-r)*(f-1); g+=(255-g)*(f-1); b+=(255-b)*(f-1); }
  r=Math.min(255,Math.round(r)); g=Math.min(255,Math.round(g)); b=Math.min(255,Math.round(b));
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function softShadow(c,x,y,rx,ry,a){
  c.fillStyle="rgba(8,12,26,"+(a||0.25)+")";
  c.beginPath(); c.ellipse(x,y,rx,ry,0,0,7); c.fill();
  c.fillStyle="rgba(8,12,26,"+((a||0.25)*0.55)+")";
  c.beginPath(); c.ellipse(x,y,rx*0.68,ry*0.68,0,0,7); c.fill();
}
function gloss(c,x,y,w,h,r,alpha){
  r=Math.min(r,w/2,h/2);
  c.save();
  c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
  c.clip();
  const g=c.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,"rgba(255,255,255,"+(alpha==null?0.35:alpha)+")");
  g.addColorStop(1,"rgba(255,255,255,0)");
  c.fillStyle=g; c.fillRect(x,y,w,h);
  c.restore();
}
function spaced(px){ try{ ctx.letterSpacing=px+"px"; }catch(e){} }
function unspaced(){ try{ ctx.letterSpacing="0px"; }catch(e){} }
function vignette(){
  if(Sprites.vig) ctx.drawImage(Sprites.vig,0,0,LW,LH);
}
</script>
<script>
"use strict";
/* ================= GAME LOGIC ================= */

/* ================= CONFIG ================= */
const BAY_Y=[596,666,736];          // y centers of the 3 bus bays
const BUS_W=440, BUS_H=58;
const ENTR={x:60,y:262};            // terminal entrance (walk-in origin)
const JAM_LIMIT=10000;

function levelParams(n){
  return {
    colors: Math.min(2+Math.floor((n-1)/2),5),
    slots: n<3?9:12,
    busCap: Math.max(4, 7-Math.floor(n/3)),
    target: 4+n,
    spawnMs: Math.max(1500, 2700-n*150),
    busTimer: Math.max(22000, 40000-n*2000),
    decoy: Math.min(0.35, 0.08+n*0.03),
  };
}
function slotPos(i,slots){
  const cols = slots===9?3:4, col=i%cols, row=Math.floor(i/cols);
  const x0 = cols===3?130:75;
  return {x:x0+col*110, y:292+row*96};
}

/* ================= GAME ================= */
let PID=1, BID=1;
const Game = window.Game = {
  state:"title", pausedByAd:false,
  level:1, coins:0, best:0, totalDispatched:0,
  passengers:[], buses:[], parts:[], floats:[],
  slotTaken:{}, spawnT:0, jamT:0, freezeT:0,
  combo:0, dispatched:0, target:6, levelCoins:0,
  shake:0, banner:"", bannerT:0, introT:0,
  tutStep:0, seenTut:false, muted:false,
  params:levelParams(1), time:0, clouds:[],
  bayRespawn:[0,0,0], rushQ:[], lastAd:0,
  overStats:null,

  autoPause(on){
    if(on && this.state==="play"){ this.pausedByAd=true; this.setState("pause"); }
    else if(!on && this.pausedByAd){ this.pausedByAd=false; this.setState("play"); }
  },
  setState(s){
    this.state=s;
    try{
      if(s==="play") Portal.gameplayStart(); else Portal.gameplayStop();
    }catch(e){}
  },

  /* ---------- flow ---------- */
  newGame(){ this.startLevel(1); },
  startLevel(n){
    this.level=n; this.params=levelParams(n);
    this.passengers=[]; this.buses=[]; this.parts=[]; this.floats=[];
    this.slotTaken={}; this.rushQ=[];
    this.combo=0; this.dispatched=0; this.target=this.params.target;
    this.levelCoins=0; this.jamT=0; this.freezeT=0; this.spawnT=1200; this.shake=0;
    this.tutStep = (!this.seenTut && n===1)?0:2;
    for(let i=0;i<3;i++){ this.buses.push(null); this.bayRespawn[i]=600+i*450; }
    for(let k=0;k<6;k++) this.spawnT0(k*220, k);
    this.introT=1500; this.banner="LEVEL "+n; this.bannerT=1500;
    this.setState("intro");
    try{ Portal.gameplayStart(); }catch(e){}
  },
  // staggered initial spawns (called pre-play so queue is filling during intro)
  spawnT0(delay,k){
    const p={id:PID++, st:"wait", wait:delay, slot:-1, color:rndi(0,this.params.colors-1),
      x:ENTR.x, y:ENTR.y, t:0, dur:600, wob:rnd(0,6.28), skin:pick(SKIN), denyT:0, bus:null};
    this.passengers.push(p);
  },

  freeSlot(){
    for(let i=0;i<this.params.slots;i++) if(!this.slotTaken[i]) return i;
    return -1;
  },
  spawnPassenger(force){
    if(this.state!=="play" && this.state!=="intro") return false;
    const s=this.freeSlot();
    if(s<0) return false;
    this.slotTaken[s]=1;
    const sp=slotPos(s,this.params.slots);
    this.passengers.push({id:PID++, st:"in", slot:s,
      color: force&&force.color!=null?force.color:rndi(0,this.params.colors-1),
      x:ENTR.x, y:ENTR.y, sx:ENTR.x, sy:ENTR.y, tx:sp.x, ty:sp.y,
      t:0, dur:650, wob:rnd(0,6.28), skin:pick(SKIN), denyT:0, bus:null});
    return true;
  },

  newBus(bay,forceColor,fast){
    const qcols={};
    this.passengers.forEach(p=>{ if(p.st==="q") qcols[p.color]=(qcols[p.color]||0)+1; });
    let color;
    if(forceColor!=null) color=forceColor;
    else{
      const keys=Object.keys(qcols);
      if(keys.length && Math.random()>this.params.decoy) color=+pick(keys);
      else color=rndi(0,this.params.colors-1);
    }
    const b={id:BID++, bay, color, cap:this.params.busCap, aboard:0, reserved:0,
      timer:this.params.busTimer, maxTimer:this.params.busTimer,
      x:560, state:"arriving", t:0, dur:fast?600:1300, wob:0, denyT:0, celeb:0, full:false};
    this.buses[bay]=b;
    Sfx.arrive();
    return b;
  },

  /* ---------- actions ---------- */
  boardPassenger(p,quiet){
    if(!p || p.st!=="q" || this.state!=="play") return false;
    let bus=null;
    for(const b of this.buses){
      if(!b||b.state!=="parked"||b.color!==p.color||(b.aboard+b.reserved)>=b.cap) continue;
      if(!bus||b.timer<bus.timer) bus=b;
    }
    if(!bus){
      if(!quiet){ p.denyT=350; this.combo=0; Sfx.deny(); this.floater(p.x,p.y-44,"NO BUS!","#f87171",15); }
      return false;
    }
    p.st="bus"; p.bus=bus; p.t=0; p.dur=480; bus.reserved++;
    p.tapT=200; // visual: tap squash
    this.sparkle(p.x,p.y-10,COLORS[p.color].light); // visual: boarding trail
    p.sx=p.x; p.sy=p.y; p.tx=bus.x+BUS_W-46; p.ty=BAY_Y[bus.bay]-6;
    return true;
  },
  arriveBus(p,bus){
    bus.reserved=Math.max(0,(bus.reserved||0)-1);
    bus.aboard++; bus.wob=1;
    this.coins++; this.levelCoins++;
    this.combo++;
    Sfx.board(); Sfx.coin();
    this.sparkle(bus.x+BUS_W-46, BAY_Y[bus.bay]-10, COLORS[bus.color].main);
    this.floater(bus.x+BUS_W-60, BAY_Y[bus.bay]-52, "+1", "#fde047", 16);
    this.removePassenger(p);
    try{ Portal.scoreChanged(this.coins); }catch(e){}
    if(this.combo>0 && this.combo%8===0){
      const bonus=5;
      this.coins+=bonus; this.levelCoins+=bonus;
      this.floater(240,300,"COMBO x"+this.combo+"  +$"+bonus+"!","#fde047",22);
      Sfx.combo(this.combo);
    }
    if((bus.aboard+bus.reserved)>=bus.cap && bus.state==="parked" && !bus.celeb){
      bus.celeb=700; bus.full=true;
      this.miniBurst(bus.x+BUS_W/2, BAY_Y[bus.bay]-30, COLORS[bus.color].light); // visual: full-bus burst
    }
  },
  removePassenger(p){
    const i=this.passengers.indexOf(p);
    if(i>=0) this.passengers.splice(i,1);
    if(p.slot>=0) delete this.slotTaken[p.slot];
  },

  dispatchBus(i,early){
    const b=this.buses[i];
    if(!b||b.state!=="parked") return false;
    if(b.aboard<=0){ b.denyT=350; Sfx.deny(); return false; }
    if(b.reserved>0){ b.denyT=350; Sfx.deny(); return false; }
    this.depart(b,b.full||!early);
    if(this.tutStep===1){ this.tutStep=2; this.seenTut=true; Store.set("seenTut","1"); }
    return true;
  },
  depart(b,full){
    if(b.state!=="play"&&b.state!=="parked") return;
    b.state="departing"; b.t=0; b.dur=950; b.full=!!full;
    Sfx.depart();
    for(let k=0;k<10;k++) this.dust(b.x+rnd(0,BUS_W), BAY_Y[b.bay]+30);
    if(full){
      const bonus=5+b.cap*2;
      this.coins+=bonus; this.levelCoins+=bonus;
      this.confetti(240,420);
      this.floater(240,380,"FULL BUS! +$"+bonus,"#4ade80",22);
      Sfx.win();
    }
    this.dispatched++; this.totalDispatched++;
    try{ Portal.scoreChanged(this.coins); }catch(e){}
    if(this.dispatched>=this.target){ this.levelComplete(); }
    else { this.banner="BUS "+this.dispatched+"/"+this.target; this.bannerT=900; }
  },

  levelComplete(){
    const bonus=10+this.level*2;
    this.coins+=bonus; this.levelCoins+=bonus;
    if(this.level>this.best){ this.best=this.level; Store.set("best",this.best); }
    Store.set("coins",this.coins);
    this.setState("levelcomplete");
    Sfx.win();
    const now=Date.now();
    if(now-this.lastAd>180000){ this.lastAd=now; try{ Portal.showInterstitial(); }catch(e){} }
  },
  gameOver(){
    this.overStats={level:this.level, coins:this.levelCoins, best:this.best};
    this.setState("gameover");
    Sfx.lose();
    try{ Portal.showInterstitial(); }catch(e){}
  },
  revive(){
    // clear half the queue, reset jam
    const q=this.passengers.filter(p=>p.st==="q"||p.st==="in");
    q.slice(0,Math.ceil(q.length/2)).forEach(p=>this.removePassenger(p));
    this.jamT=0; this.setState("play");
  },

  /* ---------- boosters ---------- */
  boosters:[
    {id:"call", name:"CALL BUS", cost:40},
    {id:"freeze", name:"FREEZE", cost:30},
    {id:"rush", name:"RUSH", cost:60},
  ],
  buyBooster(id){
    const b=this.boosters.find(x=>x.id===id);
    if(!b||this.state!=="play") return false;
    if(this.coins<b.cost){ Sfx.deny(); this.floater(240,505,"NEED $"+b.cost,"#f87171",16); return false; }
    this.coins-=b.cost; Store.set("coins",this.coins); Sfx.coin();
    if(id==="call"){
      const cnt={};
      this.passengers.forEach(p=>{ if(p.st==="q") cnt[p.color]=(cnt[p.color]||0)+1; });
      let col=0,mx=-1; for(const k in cnt) if(cnt[k]>mx){mx=cnt[k];col=+k;}
      let bi=0,ba=1e9;
      this.buses.forEach((x,i)=>{ const a=x?x.aboard:99; if(a<ba){ba=a;bi=i;} });
      const old=this.buses[bi];
      if(old&&old.state==="parked"){
        old.state="departing"; old.t=0; old.dur=700; old.full=false;
      }
      this.bayRespawn[bi]=750; this["callColor"]=col;
    }else if(id==="freeze"){
      this.freezeT=12000; Sfx.freeze();
      this.floater(240,470,"TIMERS FROZEN!","#93c5fd",20);
    }else if(id==="rush"){
      const qs=this.passengers.filter(p=>p.st==="q");
      let d=0;
      qs.forEach(p=>{ if(this.canBoard(p)){ this.rushQ.push({p,at:d}); d+=90; } });
      if(!this.rushQ.length){ this.floater(240,505,"NOBODY TO BOARD","#f87171",16); this.coins+=b.cost; Store.set("coins",this.coins); }
      else Sfx.horn();
    }
    return true;
  },
  canBoard(p){
    return this.buses.some(b=>b&&b.state==="parked"&&b.color===p.color&&(b.aboard+b.reserved)<b.cap);
  },

  /* ---------- particles/floaters ---------- */
  sparkle(x,y,col){ for(let i=0;i<8;i++) this.parts.push({x,y,vx:rnd(-90,90),vy:rnd(-140,-20),life:rnd(300,600),t:0,col,r:rnd(2,4),g:900}); },
  dust(x,y){ this.parts.push({x,y,vx:rnd(-40,40),vy:rnd(-60,-10),life:rnd(400,800),t:0,col:"rgba(180,170,160,0.7)",r:rnd(4,8),g:300}); },
  confetti(x,y){ for(let i=0;i<40;i++) this.parts.push({x:x+rnd(-40,40),y,vx:rnd(-160,160),vy:rnd(-320,-60),life:rnd(800,1600),t:0,col:pick(COLORS).main,r:rnd(3,6),g:700,rect:1}); },
  miniBurst(x,y,col){ for(let i=0;i<14;i++) this.parts.push({x:x+rnd(-24,24),y,vx:rnd(-120,120),vy:rnd(-220,-40),life:rnd(500,900),t:0,col:pick([col,"#ffffff","#fde047"]),r:rnd(2,4),g:600,rect:Math.random()<0.5?1:0}); },
  floater(x,y,txt,col,size){ this.floats.push({x,y,txt,col:col||"#fff",size:size||16,t:0,life:1100}); },

  /* ---------- tick ---------- */
  tick(dt){
    this.time+=dt;
    // clouds always drift
    if(this.clouds.length<5 && Math.random()<dt/4000) this.clouds.push({x:520,y:rnd(30,120),s:rnd(0.6,1.3),v:rnd(8,20)});
    this.clouds.forEach(c=>c.x-=c.v*dt/1000);
    this.clouds=this.clouds.filter(c=>c.x>-120);
    if(this.shake>0) this.shake=Math.max(0,this.shake-dt);
    if(this.bannerT>0){ this.bannerT-=dt; if(this.bannerT<=0) this.banner=""; }
    this.floats.forEach(f=>{f.t+=dt; f.y-=34*dt/1000;});
    this.floats=this.floats.filter(f=>f.t<f.life);
    this.parts.forEach(p=>{ p.t+=dt; p.vy+=p.g*dt/1000; p.x+=p.vx*dt/1000; p.y+=p.vy*dt/1000; });
    this.parts=this.parts.filter(p=>p.t<p.life && p.y<860);
    if(this.state==="intro"){ this.introT-=dt; if(this.introT<=0) this.setState("play"); }
    if(this.state!=="play") return;
    if(this.freezeT>0) this.freezeT-=dt;

    // rush queue (staggered auto-board)
    for(let i=this.rushQ.length-1;i>=0;i--){
      const r=this.rushQ[i]; r.at-=dt;
      if(r.at<=0){ this.rushQ.splice(i,1); if(r.p.st==="q") this.boardPassenger(r.p,true); }
    }

    // spawner
    this.spawnT-=dt;
    if(this.spawnT<=0){
      this.spawnT=this.params.spawnMs*rnd(0.8,1.2);
      if(this.freeSlot()>=0){ this.spawnPassenger(); this.jamT=0; }
      else{
        if(this.jamT===0){ this.banner="TERMINAL JAMMING!"; this.bannerT=2000; this.shake=400; Sfx.deny(); }
        this.jamT+=this.params.spawnMs;
        if(this.jamT>=JAM_LIMIT){ this.gameOver(); return; }
      }
    } else if(this.freeSlot()>=0 && this.jamT>0){ this.jamT=0; }

    // passengers
    for(let i=this.passengers.length-1;i>=0;i--){
      const p=this.passengers[i];
      if(p.denyT>0) p.denyT-=dt;
      if(p.tapT>0) p.tapT-=dt; // visual-only squash timer
      if(p.st==="wait"){ p.wait-=dt; if(p.wait<=0){ const s=this.freeSlot(); if(s>=0){ this.slotTaken[s]=1; const sp=slotPos(s,this.params.slots); p.slot=s; p.st="in"; p.sx=ENTR.x; p.sy=ENTR.y; p.tx=sp.x; p.ty=sp.y; p.t=0; } else { p.wait=400; } } }
      else if(p.st==="in"||p.st==="bus"){
        p.t+=dt;
        const k=clamp(p.t/p.dur,0,1), e=easeOut(k);
        p.x=lerp(p.sx,p.tx,e); p.y=lerp(p.sy,p.ty,e)-Math.sin(k*Math.PI)*(p.st==="bus"?26:10);
        if(k>=1){
          if(p.st==="in"){ p.st="q"; p.x=p.tx; p.y=p.ty; }
          else { const b=p.bus; p.x=p.tx; p.y=p.ty; this.arriveBus(p,b); }
        }
      }
    }

    // buses
    for(let i=0;i<3;i++){
      const b=this.buses[i];
      if(!b){
        this.bayRespawn[i]-=dt;
        if(this.bayRespawn[i]<=0 && this.state==="play"){
          const fc=this["callColor"]; this["callColor"]=null;
          this.newBus(i, fc!=null?fc:undefined, fc!=null);
        }
        continue;
      }
      if(b.denyT>0) b.denyT-=dt;
      if(b.wob>0) b.wob=Math.max(0,b.wob-dt/300);
      if(b.state==="arriving"){
        b.t+=dt; const k=clamp(b.t/b.dur,0,1);
        b.x=lerp(560,20,easeOut(k));
        if(k>=1){ b.state="parked"; b.x=20; }
      }else if(b.state==="departing"){
        b.t+=dt; const k=clamp(b.t/b.dur,0,1);
        b.x=lerp(20,600,easeIn(k));
        if(k>=1){ this.buses[i]=null; this.bayRespawn[i]=1300; }
      }else if(b.state==="parked"){
        if(b.celeb>0){
          if(b.reserved<=0){ b.celeb-=dt; if(b.celeb<=0){ this.depart(b,true); continue; } }
        }else{
          if(this.freezeT<=0){
            b.timer-=dt;
            if(b.timer<=0 && b.reserved<=0){ this.depart(b,b.aboard>=b.cap); continue; }
          }
          if((b.aboard+b.reserved)>=b.cap && !b.celeb){ b.celeb=700; b.full=true; }
        }
      }
    }
  },

  /* ---------- input ---------- */
  onTap(x,y){
    Sfx.ensure();
    if(this.state==="title"){
      if(hit(x,y,this.uiPlay)){ Sfx.click(); this.newGame(); return; }
      if(hit(x,y,this.uiMute)){ this.toggleMute(); return; }
      return;
    }
    if(this.state==="intro") return;
    if(this.state==="play"){
      if(hit(x,y,this.uiPause)){ Sfx.click(); this.setState("pause"); return; }
      if(hit(x,y,this.uiMute)){ this.toggleMute(); return; }
      for(let i=0;i<3;i++){ const b=this.uiBoost[i]; if(b&&hit(x,y,b)){ this.buyBooster(this.boosters[i].id); return; } }
      // passengers (topmost = last)
      for(let i=this.passengers.length-1;i>=0;i--){
        const p=this.passengers[i];
        if(p.st!=="q") continue;
        if(Math.hypot(x-p.x,y-p.y)<40){
          const ok=this.boardPassenger(p);
          if(ok&&this.tutStep===0){ this.tutStep=1; }
          return;
        }
      }
      // buses
      for(let i=0;i<3;i++){
        const b=this.buses[i];
        if(b&&b.state==="parked"&&x>b.x-10&&x<b.x+BUS_W+10&&y>BAY_Y[i]-10&&y<BAY_Y[i]+76){
          this.dispatchBus(i,true); return;
        }
      }
      return;
    }
    if(this.state==="pause"){
      if(hit(x,y,this.uiResume)){ Sfx.click(); this.setState("play"); }
      else if(hit(x,y,this.uiRestart)){ Sfx.click(); this.startLevel(this.level); }
      else if(hit(x,y,this.uiMenu)){ Sfx.click(); this.setState("title"); }
      else if(hit(x,y,this.uiMute)){ this.toggleMute(); }
      return;
    }
    if(this.state==="levelcomplete"){
      if(hit(x,y,this.uiNext)){ Sfx.click(); this.startLevel(this.level+1); }
      else if(hit(x,y,this.uiDouble)&&window.Portal&&Portal.rewarded){
        try{ Portal.showRewarded(ok=>{ if(ok){ this.coins+=this.levelCoins; Store.set("coins",this.coins); this.floater(240,400,"DOUBLED!","#fde047",22); Sfx.win(); } }); }catch(e){}
      }
      return;
    }
    if(this.state==="gameover"){
      if(hit(x,y,this.uiRetry)){ Sfx.click(); this.startLevel(this.level); }
      else if(hit(x,y,this.uiMenu2)){ Sfx.click(); this.setState("title"); }
      else if(hit(x,y,this.uiRevive)&&window.Portal&&Portal.rewarded){
        try{ Portal.showRewarded(ok=>{ if(ok) this.revive(); }); }catch(e){}
      }
      return;
    }
  },
  toggleMute(){ this.muted=!this.muted; Sfx.setMuted(this.muted); },

  // UI rects (filled by renderer each frame)
  uiPlay:null, uiMute:null, uiPause:null, uiBoost:[null,null,null],
  uiResume:null, uiRestart:null, uiMenu:null,
  uiNext:null, uiDouble:null, uiRetry:null, uiMenu2:null, uiRevive:null,
};
function hit(x,y,r){ return r&&x>=r.x&&y>=r.y&&x<=r.x+r.w&&y<=r.y+r.h; }

/* ================= RENDERER ================= */
// render-side only state (never touches game logic)

function _byY(a,b){ return a.y-b.y; }
let _lastCoins=-1, _coinPopT=-1e12;
let _lastBannerTxt="", _bannerT0=0, _prevState="";

function draw(){
  if(!ctx) return;
  if(Game.state!==_prevState) _prevState=Game.state;
  if(Game.banner!==_lastBannerTxt){ _lastBannerTxt=Game.banner; _bannerT0=Game.time; }
  ctx.save();
  if(Game.shake>0) ctx.translate(rnd(-1,1)*Game.shake/60, rnd(-1,1)*Game.shake/60);
  drawBackground();
  if(Game.state==="title"){ drawTitleDemo(); drawTitle(); }
  else{
    drawBays(); drawEntrance();
    // passengers sorted by y (reused scratch array: no per-frame allocation)
    _psort.length=0;
    for(let i=0;i<Game.passengers.length;i++) _psort.push(Game.passengers[i]);
    _psort.sort(_byY);
    for(let i=0;i<_psort.length;i++) drawPassenger(_psort[i]);
    Game.buses.forEach(b=>{ if(b) drawBus(b); });
    drawParts(); drawFloats();
    drawHUD(); drawBoosters();
    if(Game.jamT>0) drawJam();
    if(Game.freezeT>0) drawFreezeFx();
    if(Game.banner) drawBanner();
    if(Game.tutStep<2&&(Game.state==="play")) drawTut();
    if(Game.state==="intro") drawIntro();
    if(Game.state==="pause") drawPause();
    if(Game.state==="levelcomplete") drawLevelComplete();
    if(Game.state==="gameover") drawGameOver();
  }
  ctx.restore();
  // (vignette is baked into the background layers: no extra fullscreen pass)
}

function drawClouds(){
  // dynamic clouds, drawn between the cached sky and ground layers (1 shared baked sprite)
  const s=cloudSprite();
  for(const c of Game.clouds){
    ctx.globalAlpha=c.a;
    ctx.drawImage(s.img, c.x-75*c.s, c.y-35*c.s, 150*c.s, 70*c.s);
  }
  ctx.globalAlpha=1;
}
function drawBackground(){
  // 1:1 device-pixel blits (identity transform): no resampling cost
  ctx.save(); ctx.setTransform(1,0,0,1,0,0);
  if(Sprites.sky) ctx.drawImage(Sprites.sky,0,0);
  ctx.restore();
  drawClouds();
  ctx.save(); ctx.setTransform(1,0,0,1,0,0);
  if(Sprites.ground) ctx.drawImage(Sprites.ground,0,Sprites.groundY||0);
  ctx.restore();
}
function drawEntrance(){
  const pl=26+Math.sin(Game.time/300)*4;
  ctx.save(); ctx.globalCompositeOperation="lighter";   // additive pulse glow
  const g=ctx.createRadialGradient(ENTR.x,ENTR.y,4,ENTR.x,ENTR.y,pl+18);
  g.addColorStop(0,"rgba(255,209,102,0.55)"); g.addColorStop(1,"rgba(255,209,102,0)");
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(ENTR.x,ENTR.y,pl+18,0,7); ctx.fill();
  ctx.restore();
}
function drawBays(){
  for(let i=0;i<3;i++){
    const y=BAY_Y[i];
    ctx.strokeStyle="rgba(255,209,102,0.22)"; ctx.lineWidth=7;
    rr(ctx,10,y-40,BUS_W+20,80,12); ctx.stroke();
    ctx.strokeStyle="rgba(255,225,150,0.85)"; ctx.lineWidth=2.5; ctx.setLineDash([14,10]);
    ctx.lineDashOffset=-Game.time/40;
    rr(ctx,10,y-40,BUS_W+20,80,12); ctx.stroke(); ctx.setLineDash([]);

    spaced(1.5); ctx.fillText("BAY "+(i+1),18,y-48); unspaced();

function drawPassenger(p){
  const moving=(p.st==="in"||p.st==="bus");
  const bob=moving?Math.abs(Math.sin(Game.time/28+p.wob))*5:Math.sin(Game.time/350+p.wob)*2;
  const dx=p.denyT>0?Math.sin(Game.time/28)*6:0;
  const x=p.x+dx, y=p.y;
  // idle squash & stretch + tap squash
  let sx=1, sy=1;
  if(p.tapT>0){ const k=p.tapT/200; sx=1+0.28*k; sy=1-0.26*k; }
  else { const b=Math.sin(Game.time/350+p.wob); sy=1+b*0.025; sx=1-b*0.025; }
  const sh=shadowSprite();
  ctx.drawImage(sh.img, x-20, y+24, 40, 12);
  ctx.save();
  ctx.translate(x,y+30); ctx.scale(sx,sy); ctx.translate(-x,-(y+30));
  const by=bob*0.4;
  // feet (walk cycle, under the body like before)
  if(moving){
    ctx.fillStyle="#2b3a55";
    const f=Math.sin(Game.time/28+p.wob)*6;
    rr(ctx,x-14+f,y+20,13,10,5); ctx.fill();
    rr(ctx,x+1-f,y+20,13,10,5); ctx.fill();
  }
  // cached body+head+eyes sprite (painted once per color+skin+blink at DPR)
  const blink=(Math.sin(Game.time/900+p.wob*3)>0.985)?1:0;
  const s=paxSprite(p.color,p.skin,blink);
  ctx.drawImage(s.img, x-s.ox, y-s.oy+by, s.w, s.h);
  ctx.restore();
  if(p.denyT>0){
    ctx.fillStyle="#f87171"; ctx.font=font(800,22); ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText("\u2715",x,y-62);
  }
}
function drawBus(b){
  const col=COLORS[b.color];
  const x=b.x, y=BAY_Y[b.bay];
  const wob=b.wob>0?Math.sin(b.wob*22)*4*b.wob:0;
  const dx=b.denyT>0?Math.sin(Game.time/28)*5:0;
  const celeb=b.celeb>0?1+Math.sin(b.celeb/60)*0.03:1;
  ctx.save();
  ctx.translate(x+dx, y+wob);
  ctx.scale(celeb,celeb);
  const sh=shadowSprite();
  ctx.drawImage(sh.img, 4, 24, BUS_W-8, 20);
  // cached glossy body (painted once per color at DPR)
  const s=busSprite(b.color);
  ctx.drawImage(s.img,-s.ox,-s.oy,s.w,s.h);
  // route sign: seats (dynamic)
  ctx.fillStyle=col.dark; ctx.font=font(800,15); ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(b.aboard+"/"+b.cap,46,25);
  if(b.denyT>0){ ctx.fillStyle="#f87171"; ctx.font=font(800,20); ctx.fillText("\u2715",BUS_W/2,60); }
  ctx.restore();
  // timer bar (unscaled; hidden on title-screen demo buses)
  if(!b.demo){
  const f=clamp(b.timer/b.maxTimer,0,1);
  ctx.fillStyle="rgba(0,0,0,0.45)"; rr(ctx,x, y+40, BUS_W, 8, 4); ctx.fill();
  const tc=f>0.5?"#4ade80":(f>0.25?"#facc15":"#ef4444");
  if(f>0){
    const tg=ctx.createLinearGradient(0,y+40,0,y+48);
    tg.addColorStop(0,shade(tc,1.25)); tg.addColorStop(1,tc);
    ctx.fillStyle=tg; rr(ctx,x, y+40, BUS_W*f, 8, 4); ctx.fill();
  }
  }
  if(b.celeb>0){
    ctx.fillStyle="#fde047"; ctx.font=font(900,20); ctx.textAlign="center"; ctx.textBaseline="middle";
    spaced(1); ctx.fillText("\u2605 FULL! \u2605",x+BUS_W/2,y-44-Math.sin(b.celeb/70)*6); unspaced();
  }
}
function drawParts(){
  if(!Game.parts.length) return;
  ctx.save();
  ctx.globalCompositeOperation="lighter";   // additive glow pass for particles/explosions
  for(let i=0;i<Game.parts.length;i++){
    const p=Game.parts[i];
    ctx.globalAlpha=clamp(1-p.t/p.life,0,1);
    if(p.rect){ ctx.fillStyle=p.col; ctx.fillRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r); }
    else { const g=glowDot(p.col,p.r); ctx.drawImage(g.img,p.x-g.w/2,p.y-g.h/2,g.w,g.h); }
  }
  ctx.restore();
}
function drawFloats(){
  ctx.textAlign="center"; ctx.textBaseline="middle";
  Game.floats.forEach(f=>{
    const a=1-f.t/f.life;
    ctx.globalAlpha=clamp(a,0,1);
    const pk=clamp(f.t/180,0,1), s=1.7-0.7*easeOut(pk);
    ctx.save(); ctx.translate(f.x,f.y); ctx.scale(s,s);
    ctx.font=font(800,f.size);
    ctx.lineWidth=4; ctx.strokeStyle="rgba(0,0,0,0.55)";
    ctx.strokeText(f.txt,0,0); ctx.fillStyle=f.col; ctx.fillText(f.txt,0,0);
    ctx.restore();
  });
  ctx.globalAlpha=1;
}

  return Game.pressT&&(Game.time-Game.pressT)<160&&Game.pressX>=x&&Game.pressX<=x+w&&Game.pressY>=y&&Game.pressY<=y+h;

function button(x,y,w,h,label,sub,bg,fg){

function circleBtn(x,y,r,txt,bg){

function drawTut(){
  const bobY=Math.sin(Game.time/200)*8;
  ctx.textAlign="center";
  if(Game.tutStep===0){
    const p=Game.passengers.find(q=>q.st==="q");
    if(p){
      ctx.fillStyle="#fde047";
      ctx.beginPath(); ctx.moveTo(p.x,p.y-88+bobY); ctx.lineTo(p.x-14,p.y-64+bobY); ctx.lineTo(p.x+14,p.y-64+bobY); ctx.closePath(); ctx.fill();
      bubble(p.x,clamp(p.y-118+bobY,80,700),"Tap a passenger!");
    }
  }else if(Game.tutStep===1){
    const b=Game.buses.find(x=>x&&x.state==="parked"&&x.aboard>0)||Game.buses.find(x=>x&&x.state==="parked");
    if(b){
      const bx=b.x+BUS_W/2, by=Math.min(BAY_Y[b.bay],700);
      ctx.fillStyle="#fde047";
      ctx.beginPath(); ctx.moveTo(bx,by+66+bobY); ctx.lineTo(bx-14,by+44+bobY); ctx.lineTo(bx+14,by+44+bobY); ctx.closePath(); ctx.fill();
      bubble(bx,by+92+bobY,"Tap a bus to send it early!");
    }
  }
}
function bubble(x,y,txt){
  ctx.font=font(700,16);
  const w=ctx.measureText(txt).width+28;
  x=clamp(x,w/2+6,LW-w/2-6);
  ctx.fillStyle="rgba(8,14,30,0.92)"; rr(ctx,x-w/2,y-20,w,40,14); ctx.fill();
  ctx.lineWidth=1.5; ctx.strokeStyle="#fde047"; rr(ctx,x-w/2,y-20,w,40,14); ctx.stroke();
  ctx.fillStyle="#fde047"; ctx.textBaseline="middle"; ctx.textAlign="center";
  ctx.fillText(txt,x,y+1);
}
function dim(){ ctx.fillStyle="rgba(5,10,25,0.72)"; ctx.fillRect(0,0,LW,LH); }
function panel(y,h){
  const s=uiSprite("panel|"+h, 372+16, h+16, (c)=>{
    c.translate(8,8);
    c.fillStyle="rgba(5,8,18,0.5)"; rr(c,0,8,372,h,24); c.fill();
    const g=c.createLinearGradient(0,0,0,h);
    g.addColorStop(0,"rgba(30,45,80,0.96)"); g.addColorStop(1,"rgba(15,24,48,0.96)");
    c.fillStyle=g; rr(c,0,0,372,h,24); c.fill();
    gloss(c,4,4,364,h*0.4,20,0.12);
    c.lineWidth=2; c.strokeStyle="rgba(255,255,255,0.22)"; rr(c,0,0,372,h,24); c.stroke();
  });
  ctx.drawImage(s.img,54-8,y-8,s.w,s.h);
}

/* ================= INPUT ================= */
if(canvas&&canvas.addEventListener){
  canvas.addEventListener("pointerdown",e=>{
    try{
      e.preventDefault();
      const r=canvas.getBoundingClientRect();
      const sx=LW/((r&&r.width)||LW), sy=LH/((r&&r.height)||LH);
      const gx=(e.clientX-(r?r.left:0))*sx, gy=(e.clientY-(r?r.top:0))*sy;
      Game.pressX=gx; Game.pressY=gy; Game.pressT=Game.time; // visual: button press-down
      Game.onTap(gx,gy);
    }catch(err){}
  });
}
if(typeof document!=="undefined"&&document.addEventListener){
  document.addEventListener("touchmove",e=>{ try{e.preventDefault();}catch(_){}} ,{passive:false});
  document.addEventListener("dblclick",e=>{ try{e.preventDefault();}catch(_){}} );
  document.addEventListener("visibilitychange",()=>{ if(document.hidden) Game.autoPause(true); });
  if(typeof window!=="undefined") window.addEventListener("blur",()=>Game.autoPause(true));
}

/* ================= LOOP & BOOT ================= */
let lastT=0, frames=0;
function frame(t){
  try{
    if(typeof requestAnimationFrame!=="undefined") requestAnimationFrame(frame);
    const dt=Math.min(50,(t-lastT)||16); lastT=t;
    Game.tick(dt); draw(); frames++;
    if(frames===2){ try{ Portal.gameReady(); }catch(e){} }
  }catch(e){ /* never die on a render error */ }
}
Promise.all([Store.get("coins"),Store.get("best"),Store.get("muted"),Store.get("seenTut")]).then(v=>{
  Game.coins=parseInt(v[0]||"0",10)||0;
  Game.best=parseInt(v[1]||"0",10)||0;
  Game.muted=v[2]==="1"; Sfx.muted=Game.muted;
  Game.seenTut=v[3]==="1";
  try{ Portal.boot(); }catch(e){}
  // screenshot helper: ?shot=play skips the title and starts level 1 (no tutorial overlay)
  try{ if(new URLSearchParams(location.search).get("shot")==="play"){ Game.seenTut=true; Game.newGame(); } }catch(e){}
  if(typeof requestAnimationFrame!=="undefined") requestAnimationFrame(frame);
}).catch(()=>{ try{ Portal.boot(); }catch(e){} });
</script>
